name: Build Standalone Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pyinstaller psutil

    - name: Build Master App EXE
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "Mir4_Master_Manager" --clean master_app.py

    - name: Build Node Client EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Mir4_Node_Agent" --clean node_client.py

    - name: Archive Master App
      shell: pwsh
      run: |
        Compress-Archive -Path dist/Mir4_Master_Manager -DestinationPath dist/Mir4_Master_Manager.zip

    - name: Upload Master App Build
      uses: actions/upload-artifact@v4
      with:
        name: Mir4_Master_Manager_Windows
        path: dist/Mir4_Master_Manager.zip

    - name: Upload Node Agent Build
      uses: actions/upload-artifact@v4
      with:
        name: Mir4_Node_Agent_Windows
        path: dist/Mir4_Node_Agent.exe
